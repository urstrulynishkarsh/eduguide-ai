# Tool settings only. Dependencies live in requirements.txt / requirements-dev.txt.

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
# Tests marked `live` call real AI providers and cost money: run them with `pytest -m live`.
addopts = "-ra -m 'not live'"
markers = ["live: calls a real AI provider (needs an API key)"]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["alembic/versions/__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "S", "RUF"]
ignore = [
    "S101",   # assert is fine (tests, and narrowing types)
    "RUF001", # we use Indian-language text on purpose
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]            # test passwords
"scripts/seed.py" = ["S105", "S106"]     # demo passwords, clearly marked
"scripts/init_env.py" = ["S105"]         # the *name* of the setting, not a secret
"app/schemas/auth.py" = ["S105"]         # token_type = "bearer" is not a password

[tool.ruff.lint.isort]
known-first-party = ["app", "tests", "scripts"]
known-third-party = ["alembic"]          # otherwise our alembic/ folder is mistaken for the library

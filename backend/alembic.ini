# Database migrations. Run every command from the backend/ folder.
#
#   alembic upgrade head                                   apply all migrations
#   alembic downgrade -1                                   undo the last one
#   alembic revision --autogenerate -m "what changed" --rev-id 0002
#
# The database address is NOT set here. It comes from DATABASE_URL (see alembic/env.py).

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
path_separator = os
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

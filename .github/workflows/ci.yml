# Every push and pull request: the same checks as on a laptop (CLAUDE.md, "How to run"), the browser
# journeys, both Docker images, and the libraries' known security issues. Actions are pinned to
# commits (the tag is in the comment); the AI is off everywhere, so CI costs nothing and needs no key.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Test-only values; nothing here is a real secret.
  JWT_SECRET_KEY: ci-only-secret-key-never-used-anywhere-else-0123456789
  LLM_PROVIDER: none

jobs:
  backend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    services:
      db:
        image: pgvector/pgvector:0.8.6-pg16-trixie
        env:
          POSTGRES_USER: eduguide
          POSTGRES_PASSWORD: eduguide
          POSTGRES_DB: eduguide_test
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U eduguide" --health-interval 5s --health-retries 20
      redis:
        image: redis:8.10.1-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest
      - name: Known security issues in the libraries
        run: pip-audit -r requirements.txt

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - name: Known security issues in the libraries (high and critical)
        run: npm audit --audit-level=high

  e2e:
    needs: [backend, frontend]
    runs-on: ubuntu-24.04
    services:
      db:
        image: pgvector/pgvector:0.8.6-pg16-trixie
        env:
          POSTGRES_USER: eduguide
          POSTGRES_PASSWORD: eduguide
          POSTGRES_DB: eduguide
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U eduguide" --health-interval 5s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: The search model (~1 GB), kept between runs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: backend/storage/models
          key: search-model-multilingual-e5-base-${{ hashFiles('backend/requirements.txt') }}
      - name: The API with the demo accounts and books
        working-directory: backend
        run: |
          pip install -r requirements.txt
          alembic upgrade head
          python -m scripts.seed
          nohup uvicorn app.main:app --port 8000 > ../api.log 2>&1 &
          for _ in $(seq 30); do curl -sf http://localhost:8000/health/ready && exit 0; sleep 2; done
          cat ../api.log && exit 1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Browser journeys (Playwright builds and starts the frontend)
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-report
          path: |
            frontend/test-results
            api.log
          retention-days: 7

  images:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build -t eduguide-backend backend
      - run: docker build -t eduguide-frontend frontend
      - name: The server's compose file and the monitoring rules are valid
        env:
          DOMAIN: example.com
          POSTGRES_PASSWORD: ci
          REDIS_PASSWORD: ci
        run: |
          touch infra/production.env
          docker compose -f infra/docker-compose.production.yml config --quiet
          docker run --rm -v "$PWD/infra/monitoring:/etc/prometheus:ro" --entrypoint promtool \
            prom/prometheus:v3.15.1 check config /etc/prometheus/prometheus.yml
